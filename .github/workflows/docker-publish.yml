# Builds and pushes tonycj7/flumetv-ui images to Docker Hub.
#
# Tags (from package.json "version", e.g. 1.0.0):
#   Dockerfile              → latest, {version}
#   Dockerfile.configurable → configurable-latest, configurable-{version}
#
# Triggers on push to main when app or Docker build inputs change (not docs, etc.).
#
# Repository secrets:
#   DOCKERHUB_USERNAME — Docker Hub user (e.g. tonycj7)
#   DOCKERHUB_TOKEN    — Docker Hub access token (not account password)

name: Publish Docker images

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'containers/**'
      - 'constants/**'
      - 'contexts/**'
      - 'hooks/**'
      - 'infra/**'
      - 'store/**'
      - 'theme/**'
      - 'translations/**'
      - 'types/**'
      - 'utils/**'
      - 'validation/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'server.js'
      - 'Dockerfile'
      - 'Dockerfile.configurable'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: tonycj7/flumetv-ui
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package.json version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push default image (Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.pkg.outputs.version }}
          cache-from: type=gha,scope=flumetv-ui-default
          cache-to: type=gha,mode=max,scope=flumetv-ui-default

      - name: Build and push configurable image (Dockerfile.configurable)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.configurable
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:configurable-latest
            ${{ env.IMAGE }}:configurable-${{ steps.pkg.outputs.version }}
          cache-from: type=gha,scope=flumetv-ui-configurable
          cache-to: type=gha,mode=max,scope=flumetv-ui-configurable
